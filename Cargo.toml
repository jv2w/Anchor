[package]
name = "anchor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["aws-lc-sys", "alloc"] }
libdeflater = "=1.26.1"
miniz_oxide = "=0.9.1"
rayon = "=1.12.0"
rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
socket2 = "=0.6.5"
str0m = { version = "=0.24.0", default-features = false, features = ["aws-lc-rs"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "io-util"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
toml = { version = "=1.1.6", default-features = false, features = ["std", "serde", "parse"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }

[dev-dependencies]
# Paused time drives the deadline tests without waiting in real time.
tokio = { version = "=1.53.1", features = ["test-util"] }

[workspace]
members = ["xtask"]
# Patched copies of dependencies (PLAN.md 9.1): built as dependencies, not linted or tested as
# members; xtask/tests holds their reproduction tests.
exclude = ["vendor"]

# Fixed copies of str0m's dependencies until upstream releases the fixes (PLAN.md 9.1). Each copy
# differs from the published crate only in its fixes; remove it when a release has them.
[patch.crates-io]
dimpl = { path = "vendor/dimpl" }
sctp-proto = { path = "vendor/sctp-proto" }
str0m = { path = "vendor/str0m" }

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
must_use_candidate = "allow" # would mark nearly every pure function
missing_errors_doc = "allow" # each Error enum documents its failure modes once
struct_excessive_bools = "allow" # config structs hold independent switches
float_cmp = "allow" # tick math is bit-deterministic, so exact equality is intended
# Safety: non-test code returns errors instead of panicking, exiting, or dropping them.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
string_slice = "warn"
panic_in_result_fn = "warn"
exit = "warn"
mem_forget = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
# Performance: a reference-count bump stays visible at the call site.
clone_on_ref_ptr = "warn"
# Consistency: one module layout, names without the module name or a test_ prefix,
# and reasoned exceptions only.
mod_module_files = "warn"
module_name_repetitions = "warn"
redundant_test_prefix = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Simplicity: no debug leftovers; output goes through logging.
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Profiles apply only when this workspace is the root build: Anchor's own tests and examples.
[profile.release]
overflow-checks = true # an overflow stops the test instead of wrapping silently

[profile.release.package."*"]
overflow-checks = false # dependencies keep the behavior their authors ship and test
