# The API is new: lint public items too instead of protecting their current shape.
avoid-breaking-exported-api = false
# C-CASE: catch acronyms inside names (`HTTPServer`), not only all-caps names.
upper-case-acronyms-aggressive = true
# Proper names that doc comments may use without backticks; ".." keeps the defaults.
doc-valid-idents = ["RakNet", "NetherNet", "PocketMine", "PlayFab", ".."]
# A failing test is supposed to panic.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# Library rules (CLAUDE.md 2 and 5): tick code replays bit-identically; tick and async code never block.
disallowed-methods = [
    { path = "std::time::Instant::now", reason = "time comes from the engine clock" },
    { path = "std::time::Instant::elapsed", reason = "time comes from the engine clock" },
    { path = "std::time::SystemTime::now", reason = "time comes from the engine clock" },
    { path = "std::time::SystemTime::elapsed", reason = "time comes from the engine clock" },
    { path = "std::hash::RandomState::new", reason = "randomness comes from the engine's seeded generator" },
    { path = "std::thread::sleep", reason = "tick and async code never block" },
    { path = "std::thread::spawn", reason = "only the runtime module creates threads" },
    { path = "std::thread::Builder::spawn", reason = "only the runtime module creates threads" },
    { path = "std::thread::scope", reason = "only the runtime module creates threads" },
    { path = "std::thread::park", reason = "tick and async code never block" },
    { path = "std::thread::park_timeout", reason = "tick and async code never block" },
    { path = "std::sync::mpsc::channel", reason = "use the engine's bounded queue" },
    { path = "std::sync::mpsc::sync_channel", reason = "use the engine's bounded queue" },
    { path = "std::fs::read", reason = "tick and async code do no blocking I/O" },
    { path = "std::fs::read_to_string", reason = "tick and async code do no blocking I/O" },
    { path = "std::fs::write", reason = "tick and async code do no blocking I/O" },
    { path = "std::fs::read_dir", reason = "tick and async code do no blocking I/O" },
    { path = "std::fs::metadata", reason = "tick and async code do no blocking I/O" },
    { path = "std::fs::create_dir_all", reason = "tick and async code do no blocking I/O" },
    { path = "std::fs::rename", reason = "tick and async code do no blocking I/O" },
    { path = "std::fs::remove_file", reason = "tick and async code do no blocking I/O" },
    { path = "std::fs::copy", reason = "tick and async code do no blocking I/O" },
    { path = "std::fs::exists", reason = "tick and async code do no blocking I/O" },
    { path = "std::fs::create_dir", reason = "tick and async code do no blocking I/O" },
    { path = "std::fs::remove_dir", reason = "tick and async code do no blocking I/O" },
    { path = "std::fs::remove_dir_all", reason = "tick and async code do no blocking I/O" },
    { path = "std::fs::canonicalize", reason = "tick and async code do no blocking I/O" },
    { path = "std::fs::read_link", reason = "tick and async code do no blocking I/O" },
    { path = "std::fs::symlink_metadata", reason = "tick and async code do no blocking I/O" },
    { path = "std::fs::hard_link", reason = "tick and async code do no blocking I/O" },
    { path = "std::fs::set_permissions", reason = "tick and async code do no blocking I/O" },
    { path = "std::path::Path::exists", reason = "tick and async code do no blocking I/O" },
    { path = "std::path::Path::is_file", reason = "tick and async code do no blocking I/O" },
    { path = "std::path::Path::is_dir", reason = "tick and async code do no blocking I/O" },
    { path = "std::path::Path::try_exists", reason = "tick and async code do no blocking I/O" },
    { path = "std::path::Path::metadata", reason = "tick and async code do no blocking I/O" },
    { path = "std::path::Path::symlink_metadata", reason = "tick and async code do no blocking I/O" },
    { path = "std::path::Path::read_dir", reason = "tick and async code do no blocking I/O" },
    { path = "std::path::Path::read_link", reason = "tick and async code do no blocking I/O" },
    { path = "std::path::Path::canonicalize", reason = "tick and async code do no blocking I/O" },
    { path = "std::path::Path::is_symlink", reason = "tick and async code do no blocking I/O" },
    { path = "std::io::stdin", reason = "tick and async code do no blocking I/O" },
    { path = "std::net::ToSocketAddrs::to_socket_addrs", reason = "tick and async code do no blocking I/O" },
    # std documents each of these as "The precision of this function is non-deterministic".
    "f32::powi", "f32::powf", "f32::exp", "f32::exp2", "f32::exp_m1", "f32::ln", "f32::ln_1p",
    "f32::log", "f32::log2", "f32::log10", "f32::cbrt", "f32::hypot",
    "f32::sin", "f32::cos", "f32::tan", "f32::sin_cos", "f32::asin", "f32::acos", "f32::atan",
    "f32::atan2", "f32::sinh", "f32::cosh", "f32::tanh", "f32::asinh", "f32::acosh", "f32::atanh",
    "f32::to_degrees", "f32::to_radians",
    "f64::powi", "f64::powf", "f64::exp", "f64::exp2", "f64::exp_m1", "f64::ln", "f64::ln_1p",
    "f64::log", "f64::log2", "f64::log10", "f64::cbrt", "f64::hypot",
    "f64::sin", "f64::cos", "f64::tan", "f64::sin_cos", "f64::asin", "f64::acos", "f64::atan",
    "f64::atan2", "f64::sinh", "f64::cosh", "f64::tanh", "f64::asinh", "f64::acosh", "f64::atanh",
    "f64::to_degrees", "f64::to_radians",
    # std: when the inputs compare equal (+0.0 and -0.0), either may be returned non-deterministically.
    "f32::max", "f32::min", "f32::clamp", "f64::max", "f64::min", "f64::clamp",
]
disallowed-types = [
    { path = "std::collections::HashMap", reason = "random iteration order; use BTreeMap, a Vec indexed by a dense id, or the lookup-only index" },
    { path = "std::collections::HashSet", reason = "random iteration order; use BTreeSet, a Vec indexed by a dense id, or the lookup-only index" },
    { path = "std::cell::RefCell", reason = "borrow conflicts panic at run time; pass &mut instead" },
    { path = "std::fs::File", reason = "tick and async code do no blocking I/O" },
    { path = "std::fs::OpenOptions", reason = "tick and async code do no blocking I/O" },
    { path = "std::fs::DirBuilder", reason = "tick and async code do no blocking I/O" },
    { path = "std::net::UdpSocket", reason = "tick and async code do no blocking I/O" },
    { path = "std::net::TcpStream", reason = "tick and async code do no blocking I/O" },
    { path = "std::net::TcpListener", reason = "tick and async code do no blocking I/O" },
    # One thread owns tick state and parallel phases only read: no locks, waits or shared mutation.
    "std::sync::Mutex", "std::sync::RwLock", "std::sync::Condvar", "std::sync::Barrier",
    "std::sync::atomic::AtomicBool", "std::sync::atomic::AtomicPtr",
    "std::sync::atomic::AtomicI8", "std::sync::atomic::AtomicI16", "std::sync::atomic::AtomicI32",
    "std::sync::atomic::AtomicI64", "std::sync::atomic::AtomicIsize",
    "std::sync::atomic::AtomicU8", "std::sync::atomic::AtomicU16", "std::sync::atomic::AtomicU32",
    "std::sync::atomic::AtomicU64", "std::sync::atomic::AtomicUsize",
]
