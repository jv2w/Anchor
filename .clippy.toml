# The API is new: lint public items too instead of protecting their current shape.
avoid-breaking-exported-api = false
# C-CASE: catch acronyms inside names (`HTTPServer`), not only all-caps names.
upper-case-acronyms-aggressive = true
# Proper names that doc comments may use without backticks; ".." keeps the defaults.
doc-valid-idents = ["RakNet", "NetherNet", "PocketMine", "PlayFab", "OpenID", "LevelDB", ".."]
# windows-sys 0.52 comes from memory-stats (the resident memory of `/status`; its latest release
# pins 0.52, and a vendor copy only to share one windows-sys would cost more than the 0.52 build
# with four features, Windows only) and from ring, an optional dependency of rustls-webpki that
# Anchor does not enable. nom 7 and untrusted 0.7 appear only in cargo
# metadata through rcgen's weak `x509-parser?/verify-aws` feature (str0m's DTLS certificate); the
# build compiles neither. syn 2 (der_derive under dimpl, tracing-attributes because str0m and
# `is` keep tracing's default features) is a compile-time proc-macro dependency of str0m.
allowed-duplicate-crates = ["windows-sys", "nom", "untrusted", "syn"]
# A failing test is supposed to panic.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

