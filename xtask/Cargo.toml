[package]
name = "xtask"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# `cargo xtask p6 anchor` runs Anchor in process.
anchor = { path = ".." }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# `cargo xtask p6` and tests/spawn.rs read the addresses an in-process server logs (Anchor's own
# version).
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
# Reproduction tests of the fixed copies in vendor/, with the features Anchor and
# str0m enable. Without `path`, a test runs against the published crate and fails.
dimpl = { path = "../vendor/dimpl", version = "=0.7.5", default-features = false, features = ["aws-lc-rs", "rcgen"] }
redb = { path = "../vendor/redb", version = "=4.3.0" }
sctp-proto = { path = "../vendor/sctp-proto", version = "=0.10.5" }
