[package]
name = "xtask"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# `cargo xtask p6 anchor` runs Anchor in process.
anchor = { path = ".." }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
# Reproduction tests of the fixed copies in vendor/ (PLAN.md 9.1), with the features Anchor and
# str0m enable.
dimpl = { version = "=0.7.4", default-features = false, features = ["aws-lc-rs", "rcgen"] }
sctp-proto = "=0.10.5"
redb = "=4.3.0"
